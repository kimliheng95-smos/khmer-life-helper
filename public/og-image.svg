-- ====================== 7. attendance ======================
CREATE TABLE attendance (
    id INT PRIMARY KEY,
    student_id INT,
    class_id INT,
    date DATE DEFAULT (CURRENT_DATE),
    status ENUM('present', 'absent', 'late')
);

